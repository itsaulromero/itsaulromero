name: Render profile

on:
  schedule:
    - cron: "17 7 * * *" # every day, 01:17 in Mexico City
  push:
    branches: [main]
    paths:
      - "data/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/render-profile.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render-profile
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Render the SVG cards
        run: npm run generate
        env:
          # Optional personal token for richer numbers; the built-in token is enough.
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit the cards
        if: always()
        run: |
          if [ -n "$(git status --porcelain assets)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add assets
            git commit -m "chore(cards): render profile cards"
            git push
          else
            echo "Nothing changed."
          fi
